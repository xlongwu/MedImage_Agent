pipeline_schema_version: "0.1.0"

required_fields:
  - pipeline_id
  - version
  - modality
  - nodes

node_required_fields:
  - id
  - name
  - agent
  - backend
  - inputs
  - outputs
  - params
  - parallel_level
  - gpu_supported
  - cache

node_status:
  - PENDING
  - READY
  - RUNNING
  - SUCCESS
  - FAILED
  - SKIPPED
  - CACHED
  - RETRYING
  - NEEDS_REVIEW
  - EXCLUDED

example_node:
  id: spm_smoke_test
  name: SPM Smoke Test
  agent: spm-runner
  backend: matlab-spm
  inputs: []
  outputs:
    - work/spm_smoke_test/result.json
    - work/spm_smoke_test/smoothed.nii
  params:
    image_shape: [20, 20, 20]
    smooth_fwhm: [4, 4, 4]
  parallel_level: project
  gpu_supported: false
  cache: false
