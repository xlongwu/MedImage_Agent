pipeline_id: insights_pipeline
version: "0.2.0"
modality: project
description: "Build operational insights from SessionDB -- success rate, slowest nodes, error categories, trends."
execution:
  stop_on_failure: false
  run_id: run_insights_001
  scheduler:
    mode: sequential
    max_workers: 1
    matlab_max_workers: 0
nodes:
  - id: insights_build
    backend: python
    depends_on: []
    params:
      db_path: "outputs/memory/sessions/archive.sqlite"
      report_dir: "./reports/insights"
    parallel_level: project
