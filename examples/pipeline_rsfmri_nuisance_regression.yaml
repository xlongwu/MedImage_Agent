pipeline_id: rsfmri_nuisance_regression_pipeline
version: "0.1.0"
modality: rs-fMRI
description: "Run Python nuisance regression on smoothed normalized synthetic derivatives and generate DPABI backend contract."

execution:
  stop_on_failure: true
  run_id: "run_rsfmri_nuisance_regression_001"
  scheduler: {mode: "local_parallel", max_workers: 2, matlab_max_workers: 1}

nodes:
  - {id: create_synthetic_bids, name: Create Synthetic BIDS Dataset, agent: data-inspector, backend: python, depends_on: [], inputs: [], outputs: ["./examples/synthetic_bids/rawdata/dataset_description.json", "./examples/synthetic_bids/rawdata/participants.tsv"], params: {output_dir: "./examples/synthetic_bids/rawdata", subjects: [sub-001, sub-002]}, parallel_level: project, gpu_supported: false, cache: false}
  - {id: data_inspection, name: Data Inspection, agent: data-inspector, backend: python, depends_on: [create_synthetic_bids], inputs: ["./examples/synthetic_bids/rawdata"], outputs: ["./work/dataset_index/dataset_index.json", "./work/dataset_index/data_completeness_report.json", "./work/dataset_index/subject_table.csv"], params: {rawdata_dir: "./examples/synthetic_bids/rawdata", output_dir: "./work/dataset_index", read_nifti_metadata: true}, parallel_level: project, gpu_supported: false, cache: false}
  - {id: environment_check, name: Environment Check, agent: system, backend: matlab, depends_on: [], inputs: [], outputs: ["./work/environment_check.json"], params: {}, parallel_level: project, gpu_supported: false, cache: false}
  - {id: spm_slice_timing_subject, name: Approved SPM Slice Timing, agent: spm-runner, backend: matlab-spm, depends_on: [data_inspection, environment_check], inputs: ["./work/dataset_index/dataset_index.json"], outputs: [], params: {approved: false}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: spm_realign_subject, name: Approved SPM Realignment, agent: spm-runner, backend: matlab-spm, depends_on: [spm_slice_timing_subject], inputs: [], outputs: [], params: {approved: false, use_slice_timing_output: true}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: motion_qc_subject, name: Motion QC, agent: qc-runner, backend: python, depends_on: [spm_realign_subject], inputs: [], outputs: [], params: {fd_threshold: 0.5, head_radius_mm: 50.0}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: spm_coregister_subject, name: Approved SPM Coregistration, agent: spm-runner, backend: matlab-spm, depends_on: [spm_realign_subject], inputs: [], outputs: [], params: {approved: false}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: spm_segment_subject, name: Approved SPM Segmentation, agent: spm-runner, backend: matlab-spm, depends_on: [spm_coregister_subject], inputs: [], outputs: [], params: {approved: false}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: spm_normalize_subject, name: Approved SPM Normalization, agent: spm-runner, backend: matlab-spm, depends_on: [spm_segment_subject], inputs: [], outputs: [], params: {approved: false, voxel_size: [3.0, 3.0, 3.0]}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: spm_smooth_subject, name: Approved SPM Smoothing, agent: spm-runner, backend: matlab-spm, depends_on: [spm_normalize_subject], inputs: [], outputs: [], params: {approved: false, fwhm: [6.0, 6.0, 6.0]}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: nuisance_regression_subject, name: Python Nuisance Regression, agent: regression-runner, backend: python, depends_on: [spm_smooth_subject, motion_qc_subject, spm_segment_subject], inputs: [], outputs: [], params: {backend: python, model: friston24, include_intercept: true, include_linear_trend: true, include_global_signal: false}, parallel_level: subject, gpu_supported: false, cache: false}
  - {id: dpabi_nuisance_regression_contract, name: DPABI Nuisance Regression Contract, agent: contract-runner, backend: python, depends_on: [nuisance_regression_subject], inputs: [], outputs: ["./work/dpabi/contracts/nuisance_regression_backend_contract.json"], params: {}, parallel_level: project, gpu_supported: false, cache: false}
  - {id: nuisance_regression_qc_dataset_report, name: Nuisance Regression QC Dataset Report, agent: report-runner, backend: python, depends_on: [nuisance_regression_subject], inputs: [], outputs: ["./reports/rsfmri/nuisance_regression_qc_summary.json", "./reports/rsfmri/nuisance_regression_qc_report.md"], params: {}, parallel_level: project, gpu_supported: false, cache: false}
