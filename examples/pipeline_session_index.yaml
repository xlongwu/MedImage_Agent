pipeline_id: session_index_pipeline
version: "0.2.0"
modality: project
description: "Index all existing pipeline runs, demo runs, and run history into SessionDB."
execution:
  stop_on_failure: false
  run_id: run_session_index_001
  scheduler:
    mode: sequential
    max_workers: 1
    matlab_max_workers: 0
nodes:
  - id: session_index
    backend: python
    depends_on: []
    params:
      work_dir: "./work"
      demo_dir: "./demo_runs"
      db_path: "outputs/memory/sessions/archive.sqlite"
    parallel_level: project
