pipeline_id: dpabi_single_function_pipeline
version: "0.1.0"
modality: integration-test
description: "Run DPABI single-function wrapper sandbox test on synthetic data."

execution:
  stop_on_failure: true
  run_id: "run_dpabi_single_function_001"
  scheduler:
    mode: "sequential"
    max_workers: 1
    matlab_max_workers: 1

nodes:
  - id: environment_check
    name: Environment Check
    description: Check MATLAB, SPM, and DPABI availability
    type: project
    params: {}
    dependencies: []

  - id: dpabi_capability_inspection
    name: DPABI Capability Inspection
    description: Inspect DPABI capabilities
    type: project
    params: {}
    dependencies:
      - environment_check

  - id: dpabi_wrapper_scaffold
    name: DPABI Wrapper Scaffold
    description: Generate DPABI wrapper scaffold
    type: project
    params: {}
    dependencies:
      - dpabi_capability_inspection

  - id: dpabi_input_manifest
    name: DPABI Input Manifest
    description: Build DPABI input manifest
    type: project
    params:
      dataset_index: "./work/dataset_index/dataset_index.json"
    dependencies:
      - dpabi_wrapper_scaffold

  - id: dpabi_preflight
    name: DPABI Preflight
    description: Run DPABI preflight checks
    type: project
    params:
      capabilities_path: "./work/dpabi/dpabi_capabilities.json"
      manifest_path: "./work/dpabi/dpabi_input_manifest.json"
      wrapper_config_template_path: "./work/dpabi/dpabi_wrapper_config_template.yaml"
    dependencies:
      - dpabi_input_manifest

  - id: dpabi_run_plan
    name: DPABI Run Plan
    description: Generate DPABI run plan
    type: project
    params:
      capabilities_path: "./work/dpabi/dpabi_capabilities.json"
      manifest_path: "./work/dpabi/dpabi_input_manifest.json"
      preflight_path: "./work/dpabi/dpabi_preflight_report.json"
      params_path: "./work/dpabi/dpabi_params_review.yaml"
    dependencies:
      - dpabi_preflight

  - id: dpabi_signature_probe
    name: DPABI Signature Probe
    description: Probe DPABI function signatures
    type: project
    params: {}
    dependencies:
      - dpabi_run_plan

  - id: dpabi_wrapper_contracts
    name: DPABI Wrapper Contracts
    description: Generate wrapper contracts
    type: project
    params:
      signatures_path: "./work/dpabi/dpabi_function_signatures.json"
    dependencies:
      - dpabi_signature_probe

  - id: dpabi_single_function_sandbox
    name: DPABI Single-Function Sandbox
    description: Run approved DPABI single-function wrapper sandbox test
    type: project
    params:
      function_name: "y_Smooth"
      approved: true
      approved_by: "local-user"
    dependencies:
      - dpabi_wrapper_contracts
