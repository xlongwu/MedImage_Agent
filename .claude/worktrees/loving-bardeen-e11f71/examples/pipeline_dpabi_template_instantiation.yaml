pipeline_id: dpabi_template_instantiation_pipeline
version: "0.1.0"
modality: integration-test
description: "Instantiate and optionally execute a DPABI pipeline template."

execution:
  stop_on_failure: true
  run_id: "run_dpabi_template_instantiation_001"
  scheduler:
    mode: "sequential"
    max_workers: 1
    matlab_max_workers: 1

nodes:
  - id: dpabi_template_instantiate
    name: DPABI Template Instantiate
    agent: dpabi-runner
    backend: python
    depends_on: []
    inputs:
      - "./work/dpabi/templates/dpabi_template_index.json"
    outputs:
      - "./work/dpabi/template_instances/{instance_id}/pipeline.yaml"
      - "./work/dpabi/template_instances/{instance_id}/instance_manifest.json"
      - "./work/dpabi/template_instances/{instance_id}/instance_review.md"
    params:
      template_id: "dpabi_y_smooth_subject_wrapper_template"
      instance_id: "instance_y_smooth_001"
      run_id: "run_instance_y_smooth_001"
      function_name: "y_Smooth"
      fwhm: [4, 4, 4]
      subjects:
        - sub-001
        - sub-002
    parallel_level: project
    gpu_supported: false
    cache: false
