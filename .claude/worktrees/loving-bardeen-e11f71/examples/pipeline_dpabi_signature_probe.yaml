pipeline_id: dpabi_signature_probe_pipeline
version: "0.1.0"
modality: integration-test
description: "Probe DPABI function signatures and generate wrapper contracts."

execution:
  stop_on_failure: true
  run_id: "run_dpabi_signature_probe_001"
  scheduler:
    mode: "sequential"
    max_workers: 1
    matlab_max_workers: 1

nodes:
  - id: environment_check
    name: Environment Check
    description: Check MATLAB, SPM, and DPABI availability
    type: project
    params: {}
    dependencies: []

  - id: dpabi_capability_inspection
    name: DPABI Capability Inspection
    description: Inspect DPABI capabilities and generate capability report
    type: project
    params: {}
    dependencies:
      - environment_check

  - id: dpabi_wrapper_scaffold
    name: DPABI Wrapper Scaffold
    description: Generate DPABI wrapper scaffold configuration
    type: project
    params: {}
    dependencies:
      - dpabi_capability_inspection

  - id: dpabi_input_manifest
    name: DPABI Input Manifest
    description: Build DPABI input manifest from dataset index
    type: project
    params:
      dataset_index: "./work/dataset_index/dataset_index.json"
    dependencies:
      - dpabi_wrapper_scaffold

  - id: dpabi_preflight
    name: DPABI Preflight
    description: Run DPABI preflight checks
    type: project
    params:
      capabilities_path: "./work/dpabi/dpabi_capabilities.json"
      manifest_path: "./work/dpabi/dpabi_input_manifest.json"
      wrapper_config_template_path: "./work/dpabi/dpabi_wrapper_config_template.yaml"
    dependencies:
      - dpabi_input_manifest

  - id: dpabi_run_plan
    name: DPABI Run Plan
    description: Generate DPABI run plan with parameter review
    type: project
    params:
      capabilities_path: "./work/dpabi/dpabi_capabilities.json"
      manifest_path: "./work/dpabi/dpabi_input_manifest.json"
      preflight_path: "./work/dpabi/dpabi_preflight_report.json"
      params_path: "./work/dpabi/dpabi_params_review.yaml"
    dependencies:
      - dpabi_preflight

  - id: dpabi_signature_probe
    name: DPABI Signature Probe
    description: Probe DPABI function signatures (nargin, nargout, help)
    type: project
    params: {}
    dependencies:
      - dpabi_run_plan

  - id: dpabi_wrapper_contracts
    name: DPABI Wrapper Contracts
    description: Generate wrapper contracts from function signatures
    type: project
    params:
      signatures_path: "./work/dpabi/dpabi_function_signatures.json"
    dependencies:
      - dpabi_signature_probe
