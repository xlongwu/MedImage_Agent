name: gpu_alff_benchmark
version: "1.0.0"
nodes:
  - id: environment_check
    name: Environment Check
    description: Check MATLAB, SPM, and DPABI availability
    type: project
    params: {}
    dependencies: []

  - id: create_synthetic_bids
    name: Create Synthetic BIDS Dataset
    description: Generate synthetic BOLD data for testing
    type: project
    params:
      output_dir: "./examples/synthetic_bids/rawdata"
      n_subjects: 2
      n_volumes: 100
      tr: 2.0
      shape:
        - 32
        - 32
        - 16
    dependencies:
      - environment_check

  - id: data_inspection
    name: Data Inspection
    description: Inspect BIDS structure and generate index
    type: project
    params:
      rawdata_dir: "./examples/synthetic_bids/rawdata"
      output_dir: "./work"
    dependencies:
      - create_synthetic_bids

  - id: spm_smooth_subject
    name: SPM Smooth Subject
    description: Smooth BOLD images using SPM
    type: subject
    params:
      fwhm_mm: 6
    dependencies:
      - data_inspection

  - id: gpu_alff_subject
    name: GPU ALFF Subject
    description: Compute ALFF and fALFF with GPU/CPU backend
    type: subject
    params:
      tr: 2.0
      freq_band:
        - 0.01
        - 0.08
    dependencies:
      - spm_smooth_subject
