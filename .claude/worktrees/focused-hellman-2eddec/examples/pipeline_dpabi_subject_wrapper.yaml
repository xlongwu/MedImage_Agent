pipeline_id: dpabi_subject_wrapper_pipeline
version: "0.1.0"
modality: integration-test
description: "Run DPABI subject-level single-function wrapper on synthetic BIDS data."

execution:
  stop_on_failure: true
  run_id: "run_dpabi_subject_wrapper_001"
  scheduler:
    mode: "sequential"
    max_workers: 1
    matlab_max_workers: 1

nodes:
  - id: environment_check
    name: Environment Check
    description: Check MATLAB, SPM, and DPABI availability
    type: project
    params: {}
    dependencies: []

  - id: create_synthetic_bids
    name: Create Synthetic BIDS
    description: Create synthetic BIDS-like dataset
    type: project
    params:
      output_dir: "examples/synthetic_bids"
      num_subjects: 2
    dependencies:
      - environment_check

  - id: data_inspection
    name: Data Inspection
    description: Inspect synthetic dataset and create index
    type: project
    params:
      dataset_path: "examples/synthetic_bids"
    dependencies:
      - create_synthetic_bids

  - id: dpabi_capability_inspection
    name: DPABI Capability Inspection
    description: Inspect DPABI capabilities
    type: project
    params: {}
    dependencies:
      - data_inspection

  - id: dpabi_signature_probe
    name: DPABI Signature Probe
    description: Probe DPABI function signatures
    type: project
    params: {}
    dependencies:
      - dpabi_capability_inspection

  - id: dpabi_wrapper_contracts
    name: DPABI Wrapper Contracts
    description: Generate wrapper contracts
    type: project
    params: {}
    dependencies:
      - dpabi_signature_probe

  - id: dpabi_subject_smooth_sub01
    name: DPABI Subject Smooth - sub-01
    description: Run DPABI smoothing on subject 01
    type: subject
    subject_id: "sub-01"
    params:
      subject_id: "sub-01"
      input_bold: "examples/synthetic_bids/rawdata/sub-01/func/sub-01_task-rest_bold.nii.gz"
      function_name: "y_Smooth"
      fwhm: [4, 4, 4]
      approved: true
    dependencies:
      - dpabi_wrapper_contracts

  - id: dpabi_subject_smooth_sub02
    name: DPABI Subject Smooth - sub-02
    description: Run DPABI smoothing on subject 02
    type: subject
    subject_id: "sub-02"
    params:
      subject_id: "sub-02"
      input_bold: "examples/synthetic_bids/rawdata/sub-02/func/sub-02_task-rest_bold.nii.gz"
      function_name: "y_Smooth"
      fwhm: [4, 4, 4]
      approved: true
    dependencies:
      - dpabi_wrapper_contracts

  - id: dpabi_subject_wrapper_report
    name: DPABI Subject Wrapper Report
    description: Generate dataset-level summary report
    type: project
    params: {}
    dependencies:
      - dpabi_subject_smooth_sub01
      - dpabi_subject_smooth_sub02
